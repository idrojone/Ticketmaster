version: '3.8'

services:
  mongo-keyfile-init:
    image: busybox:1.36
    container_name: mongo-keyfile-init
    # Escribe el keyfile en el volumen con permisos seguros para mongod (UID 999)
    environment:
      MONGO_KEYFILE_CONTENT: "${MONGO_KEYFILE_CONTENT}"
    command: ["/bin/sh", "-c", "umask 077 && printf \"$MONGO_KEYFILE_CONTENT\" > /key/mongo-keyfile && chmod 600 /key/mongo-keyfile && chown 999:999 /key/mongo-keyfile"]
    volumes:
      - mongo_keyfile:/key
    restart: 'no'

  mongo:
    image: mongo:6.0
    container_name: mongo
    depends_on:
      - mongo-keyfile-init
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo/mongo-keyfile"]
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_keyfile:/etc/mongo:ro
    restart: always
    healthcheck:
      test: ["CMD", "mongo", "--username", "${MONGO_INITDB_ROOT_USERNAME}", "--password", "${MONGO_INITDB_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 10s
      retries: 5

  # mongo-init-replica:
  #   image: mongo:6.0
  #   container_name: mongo-init-replica
  #   depends_on:
  #     - mongo
  #   entrypoint: ["/bin/sh", "-c"]
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
  #     MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
  #   command: ["/bin/sh", "-c", "until mongo --host mongo:27017 --username \"$MONGO_INITDB_ROOT_USERNAME\" --password \"$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")' >/dev/null 2>&1; do echo waiting for mongo...; sleep 2; done; mongo --host mongo:27017 --username \"$MONGO_INITDB_ROOT_USERNAME\" --password \"$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'rs.initiate({_id:\"rs0\", members:[{_id:0, host:\"mongo:27017\"}]})'; echo replica set initiated; mongo --host mongo:27017 --username \"$MONGO_INITDB_ROOT_USERNAME\" --password \"$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'rs.status()' "]
  #   restart: "no"

volumes:
  mongo_data:
  mongo_keyfile: