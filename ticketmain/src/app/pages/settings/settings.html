<div class="flex min-h-screen items-center justify-center bg-gray-50 py-12 px-4">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-center mb-8 text-gray-900">Your Settings</h1>
        <!-- <app-list-errors [errors]="errors"></app-list-errors> -->
        <form [formGroup]="settingsForm" (ngSubmit)="submitForm()" class="space-y-6">
            <fieldset [disabled]="isSubmitting" class="space-y-4">
                <div>
                    <input
                        class="block w-full rounded-md border border-gray-300 py-2 px-3 shadow-sm focus:border-gray-700 focus:ring-gray-700 bg-white text-gray-900"
                        type="text"
                        placeholder="URL of profile picture"
                        formControlName="image"
                        autocomplete="off"
                    />
                </div>
                <div>
                    <input
                        class="block w-full rounded-md border border-gray-300 py-2 px-3 shadow-sm focus:border-gray-700 focus:ring-gray-700 bg-white text-gray-900"
                        type="text"
                        placeholder="Username"
                        formControlName="username"
                        autocomplete="off"
                    />
                </div>
                <div>
                    <textarea
                        class="block w-full rounded-md border border-gray-300 py-2 px-3 shadow-sm focus:border-gray-700 focus:ring-gray-700 bg-white text-gray-900"
                        rows="4"
                        placeholder="Short bio about you"
                        formControlName="bio"
                    ></textarea>
                </div>
                <div>
                    <input
                        class="block w-full rounded-md border border-gray-300 py-2 px-3 shadow-sm focus:border-gray-700 focus:ring-gray-700 bg-white text-gray-900"
                        type="email"
                        placeholder="Email"
                        formControlName="email"
                        autocomplete="off"
                    />
                </div>
                <div>
                    <input
                        class="block w-full rounded-md border border-gray-300 py-2 px-3 shadow-sm focus:border-gray-700 focus:ring-gray-700 bg-white text-gray-900"
                        type="password"
                        placeholder="New Password"
                        formControlName="password"
                        autocomplete="new-password"
                    />
                </div>
                <button
                    class="w-full py-2 px-4 bg-gray-900 text-white font-semibold rounded-md shadow hover:bg-gray-700 transition disabled:opacity-50"
                    type="submit"
                    [disabled]="isSubmitting"
                >
                    Update Settings
                </button>
            </fieldset>
        </form>
        <hr class="my-6" />
    </div>
</div>
