<div class="max-w-6xl mx-auto p-6 bg-white mt-8">
    <div class="flex flex-col md:flex-row gap-6 items-start mb-8">
        <img [src]="concierto?.imagenArtista" [alt]="concierto?.artista" class="w-64 h-64 object-cover rounded-lg shadow-lg">
        <div class="flex-1">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">{{ concierto?.nombre }}</h1>
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">{{ concierto?.artista }}</h2>
            <div class="space-y-2">
                <!-- <p class="text-lg text-gray-600">{{ concierto?.fecha | date:'dd/MM/yyyy' }}</p> -->
                <p class="text-lg text-gray-600 flex items-center">
                    <span class="mr-2">📍</span>{{ concierto?.lugar }}
                </p>
                <p class="text-2xl font-bold text-green-600">{{ concierto?.precio }}€</p>
            </div>
        </div>
    </div>

    <div class="flex flex-col md:flex-row gap-8">
        <div class="flex-1">
            <h3 class="text-2xl font-bold text-gray-900 mb-4 mt-4 flex items-center">
                <i class="fas fa-calendar-alt mr-2 text-gray-600"></i>Fecha del concierto
            </h3>
            <div class="flex justify-start">
                <div z-calendar zSize="sm" class="w-auto"></div>
            </div>
        </div>
    </div>

    @if (concierto?.imagenesShow?.length) {
    <!-- <div class="flex-1">
        <h3 class="text-2xl font-bold text-gray-900 mb-4">Imágenes del show</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-4">
            @if (concierto?.imagenesShow?.length === 0) {
            <p class="text-gray-600">No hay imágenes disponibles.</p>
            } @else {
            @for (imagen of concierto?.imagenesShow; track imagen) {
            <img [src]="imagen" [alt]="concierto?.nombre"
                class="w-full h-48 object-cover rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300">
            }
            }
        </div>
    </div> -->
    <h3 class="text-2xl font-bold text-gray-900 mb-4 mt-4 flex items-center">Imágenes del Show</h3>
    <app-carousel page="carousel-details-conciertos" [imagenesShow]="concierto?.imagenesShow"></app-carousel>
    }
</div>
