<div class="card-concierto bg-white shadow-lg rounded-lg overflow-hidden">
    <div class="card-header">
        <!-- <img [src]="concierto.imagen" [alt]="concierto.nombre" class="concierto-imagen w-full h-48 object-cover"> -->
    </div>
    
    <div class="card-body p-4">
        <h3 class="concierto-titulo text-xl font-bold text-gray-800 mb-2">{{ concierto.nombre }}</h3>
        <p class="concierto-artista text-gray-600 mb-2">{{ concierto.artista }}</p>
        <p class="concierto-fecha text-gray-500 text-sm mb-2">{{ concierto.fecha | date:'dd/MM/yyyy' }}</p>
        <p class="concierto-lugar text-gray-500 text-sm mb-2">{{ concierto.lugar }}</p>
        <p class="concierto-precio text-gray-700 font-semibold">Precio: {{ concierto.precio | currency:'EUR' }}</p>
        <button z-button>Ver mas</button>
        <!-- <a [routerLink]="['/conciertos', concierto.slug]" class="concierto-detalles-link text-blue-500 hover:underline mt-4 inline-block">Ver detalles</a> -->
    </div>
</div>
