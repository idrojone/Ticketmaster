<div class="card-concierto bg-white shadow-lg rounded-lg overflow-hidden m-4" [routerLink]="['/details', concierto.slug]" style="cursor: pointer;">
    <div class="card-header">
        <img [src]="concierto.imagenArtista" [alt]="concierto.nombre" class="concierto-imagen w-full h-48 object-cover">
    </div>
    
    <div class="card-body p-4">
        <h3 class="concierto-titulo text-xl font-bold text-gray-800 mb-2">{{ concierto.nombre }}</h3>
        <p class="concierto-artista text-blue-500 mb-2">{{ concierto.artista }}</p>
        <p class="concierto-fecha text-gray-500 text-sm mb-2">
            <i class="fas fa-calendar-alt mr-2"></i>{{ concierto.fecha | date:'dd/MM/yyyy' }}
        </p>
        <p class="concierto-lugar text-gray-500 text-sm mb-2">
            <i class="fas fa-map-marker-alt mr-2"></i>{{ concierto.lugar }}
        </p>
        <div class="flex justify-between items-center">
            <button z-button [routerLink]="['/details', concierto.slug]">
                Ver Detalles
            </button>
            <p class="concierto-precio font-semibold text-green-600">{{ concierto.precio | currency:'EUR' }}</p>
        </div>
    </div>
</div>
