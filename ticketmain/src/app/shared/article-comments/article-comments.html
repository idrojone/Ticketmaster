<div class="comments-widget">
	<div *ngIf="isLoading()" class="loading">
		<p>Cargando comentarios...</p>
	</div>

	<div *ngIf="!isLoading()">
		<div class="add-comment">
			<textarea [(ngModel)]="newComment" rows="4" placeholder="Comparte tu opinión sobre este concierto..." class="w-full p-3 border rounded"></textarea>
			<div class="flex justify-end mt-2">
				<button (click)="addComment()" class="bg-blue-600 text-white px-4 py-2 rounded">Publicar Comentario</button>
			</div>
		</div>

        @if (comments().length > 0) {
            <div class="space-y-4 mt-4">
                @for (c of comments(); track c) {
                    <div class="comment-card p-4 border rounded bg-white">
                        <div class="flex items-start gap-3">
                            <img [src]="c.autor?.image || 'https://static.productionready.io/images/smiley-cyrus.jpg'" class="w-10 h-10 rounded-full"/>
                            <div class="flex-1">
                                <div class="text-sm font-semibold">{{ c.autor?.username }}</div>
                                <!-- <div class="text-xs text-gray-500">{{ c.createdAt }}</div> -->
                                <div class="mt-2 text-gray-800">{{ c.contenido }}</div>
                                
                                @if (currentUser()?.username === c.autor?.username) {
                                    <div class="mt-2">
                                        <button (click)="deleteComment(c)" class="text-red-600 hover:underline text-sm">Eliminar</button>
                                    </div>
                                }
                            </div>
                        </div>
                    </div>
                }
            </div>
        } @else {
            <div class="mt-4">
                <p>No hay comentarios aún.</p>
            </div>
        }
	</div>
</div>
