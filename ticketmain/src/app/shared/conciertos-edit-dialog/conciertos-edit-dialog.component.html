<form class="dialog-form">
  <div class="form-group">
    <label>Nombre del Concierto</label>
    <input type="text" class="form-input" [(ngModel)]="concierto.nombre" name="nombre" />
  </div>

  <div class="form-group">
    <label>Artista</label>
    <input type="text" class="form-input" [(ngModel)]="concierto.artista" name="artista" />
  </div>

  <div class="form-group">
    <label>Lugar</label>
    <input type="text" class="form-input" [(ngModel)]="concierto.lugar" name="lugar" />
  </div>

  <div class="form-group">
    <label>Ciudad</label>
    <input type="text" class="form-input" [(ngModel)]="concierto.ciudad" name="ciudad" />
  </div>

  <div class="form-group">
    <label>Descripción</label>
    <textarea class="form-input" [(ngModel)]="concierto.descripcion" name="descripcion" rows="3"></textarea>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>Precio</label>
      <input type="number" class="form-input" [(ngModel)]="concierto.precio" name="precio" />
    </div>

    <div class="form-group">
      <label>Aforo</label>
      <input type="number" class="form-input" [(ngModel)]="concierto.aforo" name="aforo" />
    </div>

    <div class="form-group">
      <label>Duración (horas)</label>
      <input type="number" class="form-input" [(ngModel)]="concierto.duracion" name="duracion" />
    </div>
  </div>

  <div class="form-group">
    <label>Estado</label>
    <select class="form-input" [(ngModel)]="concierto.status" name="status">
      <option value="PENDING">Pendiente</option>
      <option value="APPROVED">Aprobado</option>
      <option value="REJECTED">Rechazado</option>
    </select>
  </div>

  <div class="form-group">
    <label>
      <input type="checkbox" [(ngModel)]="concierto.is_active" name="is_active" />
      Activo
    </label>
  </div>
</form>
