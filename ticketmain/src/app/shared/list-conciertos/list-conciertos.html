<div class="list-conciertos">
    @for(concierto of conciertos; track concierto.slug) {
         <app-card-conciertos [concierto]="concierto"></app-card-conciertos>
    } @empty {
        @for(skeleton of skeletonArray; track skeleton) {
            <div class="animate-pulse bg-white shadow-lg rounded-lg overflow-hidden m-4" style="min-width: 400px; height: 400px;"></div>
        }
    }
</div>
