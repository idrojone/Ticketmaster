<form class="dialog-form" [formGroup]="form">
  <div class="form-group">
    <label>Nombre del Género</label>
    <input type="text" class="form-input" formControlName="name" />
  </div>

  <div class="form-group">
    <label>Descripción</label>
    <textarea class="form-input" formControlName="description" rows="4"></textarea>
  </div>
</form>
