<div class="bg-white rounded-lg shadow-md border border-gray-200 p-6 sticky top-24">
  <h2 class="text-xl font-semibold text-gray-800 mb-4 pb-4 border-b border-gray-200">Resumen del pedido</h2>

  <div class="space-y-3 mb-6">
    <div class="flex justify-between items-center text-sm">
      <span class="text-gray-600">Subtotal</span>
      <span class="text-gray-800 font-medium">{{ subtotal() | currency:'EUR':'symbol':'1.2-2' }}</span>
    </div>

    @if(descuento() > 0) {
      <div class="flex justify-between items-center text-sm">
        <span class="text-gray-600">Descuento</span>
        <span class="text-green-600 font-medium">-{{ descuento() | currency:'EUR':'symbol':'1.2-2' }}</span>
      </div>
    }

    <div class="flex justify-between items-center text-sm">
      <span class="text-gray-600">Gastos de gestión</span>
      <span class="text-gray-800 font-medium">{{ gastosGestion() | currency:'EUR':'symbol':'1.2-2' }}</span>
    </div>
  </div>

  <div class="flex justify-between items-center pt-4 border-t border-gray-200">
    <span class="text-lg font-semibold text-gray-800">Total</span>
    <span class="text-2xl font-bold text-gray-900">{{ total() | currency:'EUR':'symbol':'1.2-2' }}</span>
  </div>

  <button 
    class="w-full mt-6 py-3 px-4 bg-primary text-primary-foreground rounded-lg hover:opacity-90 transition-opacity font-semibold text-lg disabled:opacity-50 disabled:cursor-not-allowed"
    (click)="procederAlPago()"
    [disabled]="total() === 0">
    Proceder al pago
  </button>

  <button 
    class="w-full mt-3 py-2 px-4 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors font-medium"
    [routerLink]="['/']">
    Continuar comprando
  </button>
</div>
