version: "3.8"

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - mongo-network
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # MongoDB ReplicaSet Initializer
  mongo-init:
    image: mongo:7.0
    container_name: mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mongo-network
    entrypoint:
      - bash
      - -c
      - |
        echo '===== Inicializando ReplicaSet ====='
        mongosh --host mongodb:27017 --eval '
          try {
            rs.status();
            print("✓ ReplicaSet ya está inicializado");
          } catch(err) {
            print("⚙ Inicializando ReplicaSet...");
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "mongodb:27017" }]
            });
            print("✓ ReplicaSet inicializado correctamente");
            print("Esperando 10 segundos...");
          }
        '
        sleep 10
        mongosh --host mongodb:27017 --eval 'rs.status()'
    restart: "no"

  # Prisma Migrate
  prisma-migrate:
    image: ticketmaster-dashboard-admin:latest
    container_name: prisma-migrate
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - Backend/DashboardAdmin/.env
    command: [ "sh", "-c", "pnpm prisma db push --schema=../prisma/schema.prisma || true" ]
    restart: 'no'
    networks:
      - mongo-network

  # Dashboard Admin Service
  dashboard-admin:
    build:
      context: ./Backend
      dockerfile: DashboardAdmin/Dockerfile
    image: ticketmaster-dashboard-admin:latest
    container_name: ticketmaster-dashboard-admin
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - Backend/DashboardAdmin/.env
    environment:
      - DATABASE_URL=mongodb://mongodb:27017/ticketmaster?replicaSet=rs0
      - API_HOST=0.0.0.0
      - API_PORT=3010
      - GATEWAY_URL=http://dashboard-empresa:3030
    ports:
      - "3010:3010"
    restart: on-failure
    networks:
      - mongo-network
    healthcheck:
      # HTTP healthcheck against internal debug route to verify the server responds
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3010/debug/ping').then(r=>{if(r.ok)process.exit(0);else process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  # Dashboard Empresa (API Gateway + Microservices)
  dashboard-empresa:
    build:
      context: ./Backend
      dockerfile: dashboard-empresa/Dockerfile
    image: ticketmaster-dashboard-empresa:latest
    container_name: ticketmaster-dashboard-empresa
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mongodb://mongodb:27017/ticketmaster?replicaSet=rs0
      # HTTP ports for microservices (inside container)
      - PORT=3030
      - AUTH_PORT=3031
      - MERCH_PORT=3069
      - CATEGORIA_PORT=3070
      # TCP ports for microservices
      - AUTH_TCP_PORT=3032
      - CATEGORIA_TCP_PORT=3033
      - MERCH_TCP_PORT=3034
    ports:
      - "3030:3030" # API Gateway (internal 3030)
      - "3031:3031" # Auth Service (internal 3031)
      - "3069:3069" # Merch Service (internal 3069)
      - "3070:3070" # Categoria Service (internal 3070)
    restart: on-failure
    networks:
      - mongo-network

  user-service:
    build:
      context: ./Backend/UserServices
      dockerfile: Dockerfile
    image: ticketmaster-user-service:latest
    container_name: ticketmaster-user-service
    depends_on:
      mongodb:
        condition: service_healthy
      dashboard-admin:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BIND_HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/ticketmaster?replicaSet=rs0
      - DASHBOARD_ADMIN_URL=http://dashboard-admin:3010
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - mongo-network
    healthcheck:
      test: [ "CMD", "node", "-e", "const mongoose=require('mongoose'); mongoose.connect(process.env.MONGO_URI||'mongodb://mongodb:27017/ticketmaster').then(()=>process.exit(0)).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 10s
      retries: 5

  # Stripe CLI Listener
  stripe-listener:
    image: stripe/stripe-cli:latest
    container_name: stripe-listener
    depends_on:
      dashboard-admin:
        condition: service_healthy
    command:
      - listen
      - --forward-to
      - http://dashboard-admin:3010/api/webhook
      - --skip-verify
      - --api-key
      - ${STRIPE_SECRET_KEY}
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    restart: on-failure
    networks:
      - mongo-network

  # Angular Frontend
  ticketmain-frontend:
    build:
      context: ./ticketmain
      dockerfile: Dockerfile
    container_name: ticketmain-frontend
    ports:
      - "4200:80"
    networks:
      - mongo-network
    restart: unless-stopped
    depends_on:
      - mongodb

volumes:
  mongodb_data:
  mongodb_config:


networks:
  mongo-network:
    driver: bridge
